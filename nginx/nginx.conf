server {
    listen 80;
    client_max_body_size 1m;

    location /api/auth/    { proxy_pass http://auth:5000/;    include /etc/nginx/proxy_params.conf; }
    location /api/setoran/ { proxy_pass http://setoran:5000/; include /etc/nginx/proxy_params.conf; }
    location /api/reward/  { proxy_pass http://reward:5000/;  include /etc/nginx/proxy_params.conf; }
    location /api/laporan/ { proxy_pass http://laporan:5000/; include /etc/nginx/proxy_params.conf; }
    location /             { proxy_pass http://frontend:80;   include /etc/nginx/proxy_params.conf; }
}
